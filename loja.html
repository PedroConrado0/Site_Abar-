<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Painel da Loja · Abará da Baiana</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topo">
    <div class="logo">🌿 Painel da Loja</div>
    <nav><button class="nav-btn" id="sair" hidden>Sair</button></nav>
  </header>

  <main>
    <section id="login" class="tela ativa">
      <h2>Entrar</h2>
      <form id="form-login" class="card">
        <div class="campo">
          <label for="senha">Senha da loja</label>
          <input type="password" id="senha" required autocomplete="current-password">
        </div>
        <p id="erro-login" class="erro" hidden></p>
        <button class="btn" type="submit">Entrar</button>
      </form>
    </section>

    <section id="painel" class="tela">
      <h2>Pedidos <small id="atualizado" class="dica"></small></h2>
      <div class="filtros">
        <button class="aba ativa" data-filtro="abertos">Em aberto</button>
        <button class="aba" data-filtro="finalizado">Finalizados</button>
        <button class="aba" data-filtro="todos">Todos</button>
      </div>
      <div id="lista"></div>
    </section>
  </main>
  <script src="loja.js"></script>
</body>
</html>
